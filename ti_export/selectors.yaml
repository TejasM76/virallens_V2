# Replace every PASTE_XPATH_HERE with an XPath from the live Talent Insights page
# (DevTools -> right-click element -> Copy -> Copy XPath, or write your own).
# Option XPaths must contain {value}; it is replaced with the quoted text being searched, e.g.
#   //li[@role='option'][contains(normalize-space(.), {value})]
# Fields set to "" are skipped. Leaving PASTE_XPATH_HERE anywhere stops the run.

page_ready: PASTE_XPATH_HERE        # any element that proves the report page has loaded

company:
  open: PASTE_XPATH_HERE            # button/header that expands the filter; clicked only if `input` is hidden
  input: PASTE_XPATH_HERE           # text box to type the company into
  option: PASTE_XPATH_HERE          # suggestion row, uses {value}
  confirm: ""                       # optional per-filter Apply/Done button

location:
  open: PASTE_XPATH_HERE
  input: PASTE_XPATH_HERE
  option: PASTE_XPATH_HERE
  confirm: ""

skills:
  open: PASTE_XPATH_HERE
  input: PASTE_XPATH_HERE
  option: PASTE_XPATH_HERE
  confirm: ""

skills_match_any: ""                # optional: toggle/radio that sets skills to ANY (OR)
apply_filters: ""                   # optional: global Apply/Update results button
results_ready: PASTE_XPATH_HERE     # element that appears once results have refreshed
export_button: PASTE_XPATH_HERE
export_confirm: ""                  # optional: confirm button inside the export dialog
